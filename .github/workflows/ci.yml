# CI: every push to main builds both Linux variants of the app (the
# default Wayland-only build and the x11 one), so a tag push only packages
# code that is known to build. Nothing here publishes anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wayland
            features: ""
          - variant: x11
            features: "--features x11"
    # 22.04: the oldest supported glibc, so the binary runs on most distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev libclang-dev
      - name: Build (release)
        run: cargo build --release --locked ${{ matrix.features }}
      - name: Size
        run: |
          ls -l target/release/noscat-desktop
          echo "### ${{ matrix.variant }}: $(du -h target/release/noscat-desktop | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

  # Not a supported target yet: the tray (ksni) and the keyring
  # (secret-service) are Linux only. This job reports whether the app
  # compiles there, without failing CI.
  other-os:
    name: ${{ matrix.os }} (experimental)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --locked
