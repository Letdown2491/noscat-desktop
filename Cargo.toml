[package]
name = "noscat-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["noscat contributors"]
repository = "https://github.com/Letdown2491/noscat-desktop"
description = "Desktop client for noscat, the Nostr-native mesh: chat, files, port forwards, meshes"

[[bin]]
name = "noscat-desktop"
path = "src/main.rs"

[features]
# X11 support needs libxkbcommon-x11 at link and run time. Wayland is the
# Linux default; Xorg users build with --features x11 (or install
# libxkbcommon-x11).
default = ["x11"]
x11 = ["gpui-kit/x11"]

[dependencies]
# One dependency for GPUI, gpui-base, gpui-component, and default assets.
gpui-kit = { version = "0.11", default-features = false, features = ["component", "assets"] }
# The complete Lucide icon catalog (the component crate re-exports only a
# subset); no new crate in the tree, gpui-kit already depends on it.
gpui-kit-assets = "0.11"
# Feature unification only: embeds icons in debug builds too. Our binary is
# built in a container, and rust-embed's default debug mode reads icon files
# from the container's registry path at runtime, which does not exist on the
# host - so without this, every icon renders blank in development.
rust-embed = { version = "8.7", features = ["debug-embed"] }

# The protocol. The desktop app is pure Rust, so there is no FFI layer: we
# embed noscat-client directly and replicate the small glue the FFI crate
# provides for Kotlin (mesh helpers, roster enrichment).
noscat-client = "0.4.2"
noscat-core = "0.4.2"
nostr = { version = "0.45", default-features = false, features = ["std"] }

# The mesh helpers run their own short-lived tokio runtimes, exactly like
# the FFI crate's mesh_prepare/mesh_join/mesh_sync do.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures-util = "0.3"

# Event pump: noscat-client emits events on a std mpsc channel; a pump
# thread forwards them into the GPUI executor.
async-channel = "2"

# State that survives restarts: roster, settings.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XDG data dir resolution (identity, mesh device dir, roster, inbox).
dirs = "6"

# QR display for the mesh join flow (own npub for the owner to invite) and
# the image frame type GPUI renders.
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false }

# Chat bubble timestamps in the local timezone. Already in the tree
# through gpui, so this adds no crates.
jiff = "1"

# File picker: XDG desktop portal (works on Wayland, no GTK at build time).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# System tray over StatusNotifierItem (KDE/freedesktop spec). The blocking
# API runs on its own thread; tokio is its zbus backend (and our mesh
# helpers already pull tokio).
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }

anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
